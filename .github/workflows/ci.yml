name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not integration"

  evals:
    name: Eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep the downloaded embedding model inside the workspace so it can be cached.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Start Oracle and Postgres
        run: make up

      - name: Build eval data
        run: make setup-data

      - name: Integration tests
        run: make test-integration

      - name: Eval gate
        run: make eval-gate

      - name: Database logs
        if: failure()
        run: docker compose logs --tail 80
